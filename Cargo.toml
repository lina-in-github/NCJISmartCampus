[package]
name = "smart-campus"
version = "0.1.6"
edition = "2021"
description = "智慧校园 · 班级征集、提交与回复平台"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
regex = "1"
